[workspace]
resolver = "2"
members = [
  "crates/app-core",
  "crates/app-db",
  "crates/app-server",
  "crates/app-remote",
  "crates/app-export",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/ssblthfnd/lan-meeting-collaboration-app"
authors = ["Luthfianda Salsabila <luthfiandasalsabila@gmail.com>"]

[workspace.dependencies]
# Internal crates
app-core = { path = "crates/app-core" }
app-db = { path = "crates/app-db" }
app-server = { path = "crates/app-server" }
app-remote = { path = "crates/app-remote" }
app-export = { path = "crates/app-export" }

# External (see docs/adr/0006-initial-dependency-set.md)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Identifiers and time (Phase 1, step 1). UUIDv7 is time-ordered, so a TEXT id
# also sorts chronologically. jiff carries its own IANA tzdb, which matters on
# Windows, where the OS ships none (ADR-0010).
uuid = { version = "1", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }

# SQLite (Phase 1, step 1). `bundled` compiles SQLite into the binary so there
# is no system dependency on Windows (ADR-0006).
rusqlite = { version = "0.37", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
refinery = { version = "0.9", features = ["rusqlite"] }

# LAN transport (Phase 1, step 6). Every crate here was selected in ADR-0006
# and arrives with its first use, as that ADR requires.
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
] }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
  "query",
] }
tower = "0.5"
tower-http = { version = "0.6", default-features = false, features = [
  "set-header",
  "limit",
] }

# Join and session tokens: OS entropy plus SHA-256. Tokens are 256-bit random
# values, so a password hash would be the wrong tool (ADR-0006). `subtle` was
# also selected there and is deliberately *not* added: lookups are indexed
# equality matches on a hash column, so nothing compares a secret in Rust.
rand = "0.9"
sha2 = "0.10"

# Embeds the built `apps/lan-ui` bundle in the binary, so a participant browser
# is served from the Host process with no files on disk (ADR-0006).
rust-embed = { version = "8", features = ["mime-guess"] }

# Enumerating LAN interfaces so the Host can choose which address to advertise.
# `127.0.0.1` is never assumed reachable (architecture rules section 4).
local-ip-address = "0.6"

# QR for the join URL, generated locally (PRD section 23, ADR-0017).
# `default-features = false` drops the `image` dependency: only the encoder is
# used, and the matrix is rendered as SVG rectangles by the Host UI.
qrcode = { version = "0.14", default-features = false }

# Dev-only
tempfile = "3"
http-body-util = "0.1"
