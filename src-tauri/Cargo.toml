[package]
name = "lan-meeting-app"
description = "Tauri desktop shell for the LAN Meeting Collaboration App (Host)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { workspace = true }
app-db = { workspace = true }
app-server = { workspace = true }
app-remote = { workspace = true }
app-export = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }

[features]
# Used by `tauri build --debug` to keep devtools available.
custom-protocol = ["tauri/custom-protocol"]
