[package]
name = "lan-meeting-app"
description = "Tauri desktop shell for the LAN Meeting Collaboration App (Host)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A library plus a thin binary: `HostState` and the error mapping are then
# reachable from integration tests without a running Tauri application. The
# `_lib` suffix keeps the library and binary target names distinct, which avoids
# a name collision at link time on Windows.
[lib]
name = "lan_meeting_app_lib"
path = "src/lib.rs"

[[bin]]
name = "lan-meeting-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { workspace = true }
app-db = { workspace = true }
app-server = { workspace = true }
app-remote = { workspace = true }
app-export = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
qrcode = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
app-server = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }

[features]
# Used by `tauri build --debug` to keep devtools available.
custom-protocol = ["tauri/custom-protocol"]
