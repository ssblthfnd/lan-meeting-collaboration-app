[package]
name = "app-export"
description = "Deterministic export renderers: Markdown and TXT / AI Context. PDF is deferred to Phase 2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# This crate is a pure rendering layer: every renderer is a function from
# plain data to a `String`, and rendering never fails (input has already
# been validated by `app_core::note` before it arrives here). It therefore
# needs no dependency on `app-core`, `app-db`, or an error-handling crate -
# not depending on them is what makes "app-export cannot reach into
# HostQueries or open the database" true by construction rather than by
# convention.

[dev-dependencies]
# For the shared golden-fixture cross-check against
# `packages/editor/__fixtures__/notes.json` (E-4).
serde_json = { workspace = true }
